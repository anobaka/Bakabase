# Optional Apple Silicon deployment. Mount each NAS Root on the host first.
# No Public/Container share is exposed. Keep original absolute media paths.
services:
  server:
    platform: linux/arm64
    volumes:
      - type: bind
        source: ${BAKABASE_MEDIA_ROOT_1:-/Volumes/nas-bakabase}
        target: /Volumes/nas-bakabase
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BAKABASE_MEDIA_ROOT_2:-/Volumes/nas-anobaka}
        target: /Volumes/nas-anobaka
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BAKABASE_IMPORT_DIR:-${HOME}/Downloads/Bakabase}
        target: /import
        read_only: true
        bind:
          create_host_path: false
