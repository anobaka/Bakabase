# Runs the test suites on every pull request. Independent of the
# build/deploy pipeline (deploy.yml): CI gates the PR — wire it up as a
# required status check in branch protection so nothing reaches main
# without passing — while deploy fires on the subsequent push to main.
# Only PRs run CI; the merge commit is not re-tested (it was already
# validated on the PR), which keeps deploy from re-running the suite.
name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options: [full, packages, installed]
        default: full
      package_run_id:
        description: Successful packages run to reuse for the installed suite
        type: string
        required: false

# A newer push to the same branch / PR cancels older in-progress runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installed-lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'installed'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_installed_lifecycle.yml
    with:
      package_run_id: ${{ inputs.package_run_id }}

  package-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'packages'
    uses: ./.github/workflows/_package_acceptance.yml
    with:
      ref: ${{ github.sha }}

  backend-tests:
    if: inputs.suite != 'packages' && inputs.suite != 'installed'
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: Nerdbank.GitVersioning derives the version from commit depth.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The two entry projects are not referenced by any test project, so nothing
      # else here compiles them — a break in either would first show up during a
      # deploy, which is the worst place to find out. They are small; this is
      # seconds, not minutes.
      - name: Build the app entry points
        run: |
          dotnet build src/apps/Bakabase.App/Bakabase.App.csproj
          dotnet build src/apps/Bakabase.Client.App/Bakabase.Client.App.csproj

      - name: Run tests
        run: |
          # Invoke the MSTest.Sdk executable runner directly: on SDK 9,
          # `dotnet test` can exit successfully without executing these projects.
          # Live-network ThirdParty tests are [Ignore]d and skipped.
          projects=(
            "src/tests/Bakabase.Tests/Bakabase.Tests.csproj"
            "src/tests/Bakabase.Modules.Acquisition.Tests/Bakabase.Modules.Acquisition.Tests.csproj"
            "src/tests/Bakabase.Modules.Alias.Tests/Bakabase.Modules.Alias.Tests.csproj"
            "src/tests/Bakabase.Modules.Collection.Tests/Bakabase.Modules.Collection.Tests.csproj"
            "src/tests/Bakabase.Modules.BulkModification.Tests/Bakabase.Modules.BulkModification.Tests.csproj"
            "src/tests/Bakabase.Modules.Comparison.Tests/Bakabase.Modules.Comparison.Tests.csproj"
            "src/tests/Bakabase.Modules.Enhancer.Tests/Bakabase.Modules.Enhancer.Tests.csproj"
            "src/tests/Bakabase.Modules.HealthScore.Tests/Bakabase.Modules.HealthScore.Tests.csproj"
            "src/tests/Bakabase.Modules.Player.Tests/Bakabase.Modules.Player.Tests.csproj"
            "src/tests/Bakabase.Modules.Federation.Tests/Bakabase.Modules.Federation.Tests.csproj"
            "src/tests/Bakabase.Modules.Property.Tests/Bakabase.Modules.Property.Tests.csproj"
            "src/tests/Bakabase.Modules.StandardValue.Tests/Bakabase.Modules.StandardValue.Tests.csproj"
            "src/tests/Bakabase.Modules.ThirdParty.Tests/Bakabase.Modules.ThirdParty.Tests.csproj"
          )
          failed=()
          for proj in "${projects[@]}"; do
            echo "::group::Tests ${proj}"
            if [[ "${proj}" == "src/tests/Bakabase.Tests/Bakabase.Tests.csproj" ]]; then
              # Legacy fixtures retain a SQLite directory per test. Dispose each
              # class's owned temp directory so full execution cannot fill the disk.
              python3 src/tests/run-backend-tests.py --project "${proj}" \
                --results-directory "${RUNNER_TEMP}/bakabase-backend-results" || failed+=("${proj}")
            else
              dotnet run --project "${proj}" -- --minimum-expected-tests 1 || failed+=("${proj}")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::Test project failed: %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Retain backend class results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-class-results
          path: ${{ runner.temp }}/bakabase-backend-results
          if-no-files-found: ignore

  federation-platform:
    if: inputs.suite != 'packages' && inputs.suite != 'installed'
    name: Federation and release contracts (${{ matrix.rid }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            runtimeMode: WINFORMS
            desktop: true
          - os: ubuntu-24.04
            rid: linux-x64
            runtimeMode: DOCKER
            desktop: false
          - os: macos-15-intel
            rid: osx-x64
            runtimeMode: MACOS
            desktop: true
          - os: macos-15
            rid: osx-arm64
            runtimeMode: MACOS
            desktop: true
    defaults:
      run:
        shell: bash
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source identities and release guard failure cases
        run: |
          python src/tests/upgrade-tests/check-release-contract.py --report "$RUNNER_TEMP/federation-results/product-identities.json"
          python src/tests/upgrade-tests/test_release_contract.py
      - name: Identity, AppData, relocation and migration whitelist contracts
        run: python src/tests/upgrade-tests/run-compatibility.py --results-directory "$RUNNER_TEMP/federation-results/compatibility"
      - name: Backend runner selection guards
        run: python -m unittest discover -s src/tests -p 'test_backend_runner.py'
      - name: Service federation integration and player policy contracts
        run: |
          # Compatibility above builds this assembly. Select the entire namespace
          # so new Service federation classes join every OS gate automatically:
          # real library projection, sharing/browsing, mappings, directory/media
          # security, and stream player arguments/proxy selection.
          # An empty or misspelled namespace fails; all discovered cases still run.
          python src/tests/run-backend-tests.py --no-build \
            --project src/tests/Bakabase.Tests/Bakabase.Tests.csproj \
            --namespace Bakabase.Tests.Federation \
            --results-directory "$RUNNER_TEMP/federation-results/service"
      - name: Federation protocol, budgets and filesystem boundaries
        run: dotnet run --project src/tests/Bakabase.Modules.Federation.Tests -- --minimum-expected-tests 1 --report-trx --results-directory "$RUNNER_TEMP/federation-results/protocol"
      - name: Native player discovery and launch arguments
        run: dotnet run --project src/tests/Bakabase.Modules.Player.Tests -- --minimum-expected-tests 1 --report-trx --results-directory "$RUNNER_TEMP/federation-results/player"
      - name: Three independent native hosts
        run: |
          dotnet build src/tests/Bakabase.Federation.TestHost/Bakabase.Federation.TestHost.csproj
          python src/tests/federation-smoke/run.py --timeout 300 --results-directory "$RUNNER_TEMP/federation-results/smoke"
      - uses: actions/download-artifact@v4
        with:
          name: federation-ci-web
          path: ${{ runner.temp }}/federation-web
      - name: Inspect actual headless publish contents
        run: |
          dotnet publish src/apps/Bakabase.Service/Bakabase.Service.csproj -p:RuntimeMode=DOCKER --self-contained false -r ${{ matrix.rid }} -o "$RUNNER_TEMP/publish-server"
          python -c 'import os, shutil; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"]); shutil.copytree(p/"federation-web", p/"publish-server/web")'
          python src/tests/upgrade-tests/check-release-contract.py --role server --publish-dir "$RUNNER_TEMP/publish-server" --require-web --report "$RUNNER_TEMP/federation-results/server-package.json"
      - name: Inspect actual desktop publish contents
        if: matrix.desktop
        run: |
          dotnet publish src/apps/Bakabase.App/Bakabase.App.csproj -p:RuntimeMode=${{ matrix.runtimeMode }} --self-contained false -r ${{ matrix.rid }} -o "$RUNNER_TEMP/publish-unified"
          python -c 'import os, shutil; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"]); shutil.copytree(p/"federation-web", p/"publish-unified/web")'
          python src/tests/upgrade-tests/check-release-contract.py --role unified --publish-dir "$RUNNER_TEMP/publish-unified" --require-web --report "$RUNNER_TEMP/federation-results/unified-package.json"
          dotnet publish src/apps/Bakabase.Client.App/Bakabase.Client.App.csproj -p:RuntimeMode=${{ matrix.runtimeMode }} --self-contained false -r ${{ matrix.rid }} -o "$RUNNER_TEMP/publish-client"
          python src/tests/upgrade-tests/check-release-contract.py --role client --publish-dir "$RUNNER_TEMP/publish-client" --report "$RUNNER_TEMP/federation-results/client-package.json"
      - name: Retain platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-${{ matrix.rid }}-evidence
          path: ${{ runner.temp }}/federation-results
          if-no-files-found: warn
          retention-days: 14

  federation-browser:
    if: inputs.suite != 'packages' && inputs.suite != 'installed'
    name: Legacy migration and multi-device browser
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/tests/federation-browser-smoke/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: federation-ci-web
          path: src/web/dist
      - name: Install isolated browser test dependencies
        working-directory: src/tests/federation-browser-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Browser runner failure diagnostics
        run: python3 -m unittest discover -s src/tests/federation-browser-smoke -p 'test*.py'
      - name: Isolated runner failure and cleanup guards
        run: |
          # These exercise fixture boundaries only; no Docker or native app starts.
          python3 src/tests/federation-smoke/test_linux_cross_container.py
          python3 src/tests/upgrade-tests/test_velopack_runner.py
          python3 src/tests/upgrade-tests/test_package_acceptance.py
          python3 src/tests/upgrade-tests/test_installed_inputs.py
          python3 src/tests/upgrade-tests/test_installed_lifecycle.py
          python3 src/tests/upgrade-tests/test_installed_updates.py
          python3 src/tests/upgrade-tests/test_installed_update_feed.py
          python3 src/tests/upgrade-tests/test_installed_update_exercise.py
          python3 src/tests/federation-smoke/test_docker_boundary.py
      - name: Real legacy export, import, reauthorization and media
        run: python3 src/tests/federation-browser-smoke/run.py --results-directory "$RUNNER_TEMP/federation-browser-results"
      - name: Generate synthetic video for streaming faults
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          # Owned fixture only: no user media and no video upload in the evidence artifact.
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=24" -t 120 -an \
            -c:v libvpx -deadline realtime -cpu-used 8 -b:v 900k -g 48 \
            "$RUNNER_TEMP/federation-stream-fixture.webm"
      - name: Decoded video, slow streams, seek, interruption and opt-out
        run: |
          # Reuse the production TestHost and web assets built by the browser runner.
          python3 src/tests/federation-smoke/media-stream.py \
            --media "$RUNNER_TEMP/federation-stream-fixture.webm" \
            --results-directory "$RUNNER_TEMP/federation-browser-results/media" \
            --timeout 240
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-browser-evidence
          path: ${{ runner.temp }}/federation-browser-results
          if-no-files-found: warn
          retention-days: 14

  frontend:
    if: inputs.suite != 'packages' && inputs.suite != 'installed'
    name: Frontend lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable yarn

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            src/web/.yarn/cache
            src/web/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('src/web/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        if: ${{ !cancelled() }}
        run: yarn vitest run

      - name: Production build
        if: ${{ !cancelled() }}
        run: yarn build

      - name: Frontend for package content checks
        uses: actions/upload-artifact@v4
        with:
          name: federation-ci-web
          path: src/web/dist
