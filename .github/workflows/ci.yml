# Runs the test suites on every pull request. Independent of the
# build/deploy pipeline (deploy.yml): CI gates the PR — wire it up as a
# required status check in branch protection so nothing reaches main
# without passing — while deploy fires on the subsequent push to main.
# Only PRs run CI; the merge commit is not re-tested (it was already
# validated on the PR), which keeps deploy from re-running the suite.
#
# Pull requests stay on Linux. The desktop platform checks (Windows/macOS
# publish contents, the macOS native ABI probe, streaming faults) and the
# installer acceptance run on demand before a release: dispatch this workflow
# with suite=platforms or suite=packages.
name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options: [full, platforms, packages]
        default: full

# A newer push to the same branch / PR cancels older in-progress runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-main-shards:
    if: inputs.suite != 'platforms' && inputs.suite != 'packages'
    name: Backend main tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Complementary filters keep every test in exactly one group, including
          # new tests. Keep all convergence seeds and their coverage assertions.
          - group: data-sync
            filter: FullyQualifiedName~Bakabase.Tests.DataSync.
          - group: other
            filter: FullyQualifiedName!~Bakabase.Tests.DataSync.
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
      TEST_FILTER: ${{ matrix.filter }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: Nerdbank.GitVersioning derives the version from commit depth.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Run main test assembly with TRX timings
        id: tests
        run: |
          dotnet test src/tests/Bakabase.Tests/Bakabase.Tests.csproj -- \
            --filter "$TEST_FILTER" \
            --minimum-expected-tests 1 \
            --report-trx --results-directory "$RUNNER_TEMP/backend-test-results"

      - name: Summarize slowest tests
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: python3 .github/scripts/trx_timing_summary.py "$RUNNER_TEMP/backend-test-results" "$GITHUB_STEP_SUMMARY" "Backend main test timings (${{ matrix.group }})"

      - name: Retain TRX results
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-main-trx-${{ matrix.group }}
          path: ${{ runner.temp }}/backend-test-results
          if-no-files-found: warn
          retention-days: 14

  # Preserve the existing check name and fail if any shard fails or is cancelled.
  backend-main-tests:
    if: ${{ always() && inputs.suite != 'platforms' && inputs.suite != 'packages' }}
    name: Backend main tests
    needs: backend-main-shards
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all main test groups passed
        env:
          RESULT: ${{ needs.backend-main-shards.result }}
        run: |
          if [[ "$RESULT" != success ]]; then
            echo "::error::Backend main test groups: $RESULT"
            exit 1
          fi

  backend-module-tests:
    if: inputs.suite != 'platforms' && inputs.suite != 'packages'
    name: Backend module tests
    runs-on: ubuntu-latest
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Verify CI test runner
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # Build the app entry point and every module test in one graph before
      # running two assemblies at a time. Tests never race to write shared obj/bin.
      - name: Build once and run module tests
        id: tests
        run: python3 .github/scripts/run_module_tests.py --results-directory "$RUNNER_TEMP/backend-module-results" --workers 2

      - name: Summarize slowest module tests
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: python3 .github/scripts/trx_timing_summary.py "$RUNNER_TEMP/backend-module-results" "$GITHUB_STEP_SUMMARY" "Backend module test timings"

      - name: Retain module test results and logs
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-module-trx
          path: ${{ runner.temp }}/backend-module-results
          if-no-files-found: warn
          retention-days: 14

  # Keep the existing required-check name while the two test groups run in
  # parallel. A failure in either group must fail the required check.
  backend-tests:
    if: ${{ always() && inputs.suite != 'platforms' && inputs.suite != 'packages' }}
    name: Backend tests
    needs: [backend-main-tests, backend-module-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm both test groups passed
        env:
          MAIN_RESULT: ${{ needs.backend-main-tests.result }}
          MODULE_RESULT: ${{ needs.backend-module-tests.result }}
        run: |
          if [[ "$MAIN_RESULT" != success || "$MODULE_RESULT" != success ]]; then
            echo "::error::Backend main tests: $MAIN_RESULT; backend module tests: $MODULE_RESULT"
            exit 1
          fi

  frontend-quality:
    if: inputs.suite != 'packages'
    name: Frontend lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable yarn

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache.outputs.path }}
            src/web/node_modules
            src/web/.yarn/install-state.gz
          key: yarn-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('src/web/yarn.lock', 'src/web/package.json', 'src/web/.yarnrc.yml', 'src/web/.yarn/patches/**') }}
          restore-keys: |
            yarn-v2-${{ runner.os }}-${{ runner.arch }}-node22-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        if: ${{ !cancelled() }}
        run: yarn vitest run

  frontend-build:
    if: inputs.suite != 'packages'
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable yarn

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache.outputs.path }}
            src/web/node_modules
            src/web/.yarn/install-state.gz
          key: yarn-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('src/web/yarn.lock', 'src/web/package.json', 'src/web/.yarnrc.yml', 'src/web/.yarn/patches/**') }}
          restore-keys: |
            yarn-v2-${{ runner.os }}-${{ runner.arch }}-node22-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Production build
        run: yarn build

      - name: Frontend for integration and package checks
        uses: actions/upload-artifact@v4
        with:
          name: ci-web
          path: src/web/dist
          if-no-files-found: error
          retention-days: 3

  # Preserve the existing required-check name and make build failures block the
  # PR while the federation job can start as soon as the web artifact is ready.
  frontend:
    if: ${{ always() && inputs.suite != 'packages' }}
    name: Frontend lint & tests
    needs: [frontend-quality, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm frontend checks passed
        env:
          QUALITY_RESULT: ${{ needs.frontend-quality.result }}
          BUILD_RESULT: ${{ needs.frontend-build.result }}
        run: |
          if [[ "$QUALITY_RESULT" != success || "$BUILD_RESULT" != success ]]; then
            echo "::error::Frontend lint & unit tests: $QUALITY_RESULT; frontend build: $BUILD_RESULT"
            exit 1
          fi

  # Compile the fixture once, alongside the frontend. Both smoke suites consume
  # this exact output; only the browser suite needs the production web assets.
  federation-build:
    if: inputs.suite != 'platforms' && inputs.suite != 'packages'
    name: Federation host build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build the federation host
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/federation-results"
          dotnet build src/tests/Bakabase.Federation.TestHost/Bakabase.Federation.TestHost.csproj \
            2>&1 | tee "$RUNNER_TEMP/federation-results/build.log"
      - name: Archive the complete fixture output
        run: |
          # Data sync also runs Bakabase.Service.dll as a CLI. Keep every dependency,
          # runtime/config file and native asset, with permissions and symlinks intact.
          test -f src/tests/Bakabase.Federation.TestHost/bin/Debug/net9.0/Bakabase.Federation.TestHost.dll
          test -f src/tests/Bakabase.Federation.TestHost/bin/Debug/net9.0/Bakabase.Service.dll
          tar -cf "$RUNNER_TEMP/federation-testhost.tar" \
            -C src/tests/Bakabase.Federation.TestHost/bin/Debug/net9.0 .
      - name: Share the fixture build
        uses: actions/upload-artifact@v4
        with:
          name: ci-federation-testhost
          path: ${{ runner.temp }}/federation-testhost.tar
          compression-level: 1
          if-no-files-found: error
          retention-days: 3
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-build-evidence
          path: ${{ runner.temp }}/federation-results
          if-no-files-found: warn
          retention-days: 14

  federation-protocol:
    if: inputs.suite != 'platforms' && inputs.suite != 'packages'
    name: Federation protocol smoke (Linux)
    needs: federation-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ci-federation-testhost
          path: ${{ runner.temp }}/federation-build
      - name: Restore the fixture build
        run: |
          mkdir -p src/tests/Bakabase.Federation.TestHost/bin/Debug/net9.0
          tar -xpf "$RUNNER_TEMP/federation-build/federation-testhost.tar" \
            -C src/tests/Bakabase.Federation.TestHost/bin/Debug/net9.0
      - name: Three independent hosts, then data sync across three more
        run: python src/tests/federation-smoke/run.py --timeout 300 --results-directory "$RUNNER_TEMP/federation-results/smoke"
      - name: Retain protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-protocol-evidence
          path: ${{ runner.temp }}/federation-results
          if-no-files-found: warn
          retention-days: 14

  federation-browser:
    if: inputs.suite != 'platforms' && inputs.suite != 'packages'
    name: Federation browser smoke (Linux)
    needs: [federation-build, frontend-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/tests/federation-browser-smoke/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ci-federation-testhost
          path: ${{ runner.temp }}/federation-build
      - name: Restore the fixture build
        run: |
          mkdir -p src/tests/Bakabase.Federation.TestHost/bin/Debug/net9.0
          tar -xpf "$RUNNER_TEMP/federation-build/federation-testhost.tar" \
            -C src/tests/Bakabase.Federation.TestHost/bin/Debug/net9.0
      - uses: actions/download-artifact@v4
        with:
          name: ci-web
          path: src/web/dist
      - name: Install the headless browser
        working-directory: src/tests/federation-browser-smoke
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps --only-shell chromium
      - name: Browser runner unit tests
        run: python3 -m unittest discover -s src/tests/federation-browser-smoke -p 'test*.py'
      - name: First launch, pairing, media and server switching in a browser
        run: python3 src/tests/federation-browser-smoke/run.py --no-build --results-directory "$RUNNER_TEMP/federation-results/browser"
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-browser-evidence
          path: ${{ runner.temp }}/federation-results
          if-no-files-found: warn
          retention-days: 14

  # Publishing has its own Release/RID build. Run the complete release contract
  # and its guard cases alongside the smoke suites.
  federation-publish:
    if: inputs.suite != 'platforms' && inputs.suite != 'packages'
    name: Headless publish contracts (Linux)
    needs: frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: ci-web
          path: src/web/dist
      - name: Release identities and their guard cases
        run: |
          python src/scripts/check-release-contract.py --report "$RUNNER_TEMP/federation-results/product-identities.json"
          python src/tests/upgrade-tests/test_release_contract.py
          python src/tests/upgrade-tests/test_package_acceptance.py
      - name: Headless publish contents
        run: |
          dotnet publish src/apps/Bakabase.Service/Bakabase.Service.csproj -p:RuntimeMode=DOCKER --self-contained false -r linux-x64 -o "$RUNNER_TEMP/publish-server"
          cp -R src/web/dist "$RUNNER_TEMP/publish-server/web"
          python src/scripts/check-release-contract.py --role server --publish-dir "$RUNNER_TEMP/publish-server" --require-web --report "$RUNNER_TEMP/federation-results/server-package.json"
      - name: Retain publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-publish-evidence
          path: ${{ runner.temp }}/federation-results
          if-no-files-found: warn
          retention-days: 14

  # Preserve the required-check name. A failed or skipped prerequisite must fail
  # the gate, even if GitHub skipped the smoke jobs after an earlier build failure.
  federation:
    if: ${{ always() && inputs.suite != 'platforms' && inputs.suite != 'packages' }}
    name: Multi-device federation (Linux)
    needs: [federation-build, federation-protocol, federation-browser, federation-publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm all federation checks passed
        env:
          BUILD_RESULT: ${{ needs.federation-build.result }}
          PROTOCOL_RESULT: ${{ needs.federation-protocol.result }}
          BROWSER_RESULT: ${{ needs.federation-browser.result }}
          PUBLISH_RESULT: ${{ needs.federation-publish.result }}
        run: |
          if [[ "$BUILD_RESULT" != success || "$PROTOCOL_RESULT" != success || "$BROWSER_RESULT" != success || "$PUBLISH_RESULT" != success ]]; then
            echo "::error::Federation build: $BUILD_RESULT; protocol: $PROTOCOL_RESULT; browser: $BROWSER_RESULT; publish: $PUBLISH_RESULT"
            exit 1
          fi

  # On demand before a release: what only a real desktop OS can show.
  federation-platforms:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'platforms'
    name: Desktop platform contracts (${{ matrix.rid }})
    needs: frontend-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, rid: win-x64, runtimeMode: WINFORMS}
          - {os: macos-15-intel, rid: osx-x64, runtimeMode: MACOS}
          - {os: macos-15, rid: osx-arm64, runtimeMode: MACOS}
          - {os: ubuntu-24.04, rid: linux-x64, runtimeMode: DOCKER}
    defaults:
      run:
        shell: bash
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ci-web
          path: src/web/dist
      - name: Identity, AppData, relocation and migration contracts
        run: python src/tests/upgrade-tests/run-compatibility.py --results-directory "$RUNNER_TEMP/federation-results/compatibility"
      - name: Federation protocol and Service integration
        run: |
          dotnet test src/tests/Bakabase.Modules.Federation.Tests/Bakabase.Modules.Federation.Tests.csproj
          dotnet test src/tests/Bakabase.Modules.Player.Tests/Bakabase.Modules.Player.Tests.csproj
          dotnet test src/tests/Bakabase.Tests/Bakabase.Tests.csproj --filter "FullyQualifiedName~Bakabase.Tests.Federation"
          for nls in false true; do for p in Bakabase.Modules.DataSync.Tests/Bakabase.Modules.DataSync.Tests Bakabase.Tests/Bakabase.Tests; do DOTNET_SYSTEM_GLOBALIZATION_USENLS=$nls dotnet test src/tests/$p.csproj -- --filter "FullyQualifiedName~LabelKeyCrossCheckTests" || exit 1; done; done
      - name: Verify the actual macOS rectangle calling convention
        if: startsWith(matrix.rid, 'osx-')
        run: |
          dotnet run --project src/tests/Bakabase.Shell.NativeAbiProbe \
            --configuration Release -p:RuntimeMode=MACOS \
            -- --report "$RUNNER_TEMP/federation-results/native-abi.json"
      - name: Three independent hosts, then data sync across three more
        run: |
          dotnet build src/tests/Bakabase.Federation.TestHost/Bakabase.Federation.TestHost.csproj
          python src/tests/federation-smoke/run.py --timeout 300 --results-directory "$RUNNER_TEMP/federation-results/smoke"
      - name: Desktop publish contents
        if: matrix.runtimeMode != 'DOCKER'
        run: |
          dotnet publish src/apps/Bakabase.App/Bakabase.App.csproj -p:RuntimeMode=${{ matrix.runtimeMode }} --self-contained false -r ${{ matrix.rid }} -o "$RUNNER_TEMP/publish-unified"
          cp -R src/web/dist "$RUNNER_TEMP/publish-unified/web"
          python src/scripts/check-release-contract.py --role unified --publish-dir "$RUNNER_TEMP/publish-unified" --require-web --report "$RUNNER_TEMP/federation-results/unified-package.json"
      - name: Decoded video, slow streams, seek, interruption and opt-out
        if: matrix.runtimeMode == 'DOCKER'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          # Owned fixture only: no user media and no video upload in the evidence artifact.
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=24" -t 120 -an \
            -c:v libvpx -deadline realtime -cpu-used 8 -b:v 900k -g 48 \
            "$RUNNER_TEMP/federation-stream-fixture.webm"
          python3 src/tests/federation-smoke/media-stream.py \
            --media "$RUNNER_TEMP/federation-stream-fixture.webm" \
            --results-directory "$RUNNER_TEMP/federation-results/media" \
            --timeout 240
      - name: Retain platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-${{ matrix.rid }}-evidence
          path: ${{ runner.temp }}/federation-results
          if-no-files-found: warn
          retention-days: 14

  package-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'packages'
    uses: ./.github/workflows/_package_acceptance.yml
    with:
      ref: ${{ github.sha }}
