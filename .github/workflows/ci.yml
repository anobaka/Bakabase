# Runs the test suites on every pull request. Independent of the
# build/deploy pipeline (deploy.yml): CI gates the PR — wire it up as a
# required status check in branch protection so nothing reaches main
# without passing — while deploy fires on the subsequent push to main.
# Only PRs run CI; the merge commit is not re-tested (it was already
# validated on the PR), which keeps deploy from re-running the suite.
#
# Pull requests stay on Linux. The desktop platform checks (Windows/macOS
# publish contents, the macOS native ABI probe, streaming faults) and the
# installer acceptance run on demand before a release: dispatch this workflow
# with suite=platforms or suite=packages.
name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options: [full, platforms, packages]
        default: full

# A newer push to the same branch / PR cancels older in-progress runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'full' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    if: inputs.suite != 'platforms' && inputs.suite != 'packages'
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history: Nerdbank.GitVersioning derives the version from commit depth.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # The two entry projects are not referenced by any test project, so nothing
      # else here compiles them — a break in either would first show up during a
      # deploy, which is the worst place to find out. They are small; this is
      # seconds, not minutes.
      - name: Build the app entry points
        run: |
          dotnet build src/apps/Bakabase.App/Bakabase.App.csproj
          dotnet build src/apps/Bakabase.Client.App/Bakabase.Client.App.csproj

      - name: Run tests
        run: |
          # One `dotnet test` per project so a single failure does not mask
          # the rest. Live-network ThirdParty tests are [Ignore]d and skipped.
          projects=(
            "src/tests/Bakabase.Tests/Bakabase.Tests.csproj"
            "src/tests/Bakabase.Modules.Acquisition.Tests/Bakabase.Modules.Acquisition.Tests.csproj"
            "src/tests/Bakabase.Modules.Alias.Tests/Bakabase.Modules.Alias.Tests.csproj"
            "src/tests/Bakabase.Modules.Collection.Tests/Bakabase.Modules.Collection.Tests.csproj"
            "src/tests/Bakabase.Modules.BulkModification.Tests/Bakabase.Modules.BulkModification.Tests.csproj"
            "src/tests/Bakabase.Modules.Comparison.Tests/Bakabase.Modules.Comparison.Tests.csproj"
            "src/tests/Bakabase.Modules.Enhancer.Tests/Bakabase.Modules.Enhancer.Tests.csproj"
            "src/tests/Bakabase.Modules.Federation.Tests/Bakabase.Modules.Federation.Tests.csproj"
            "src/tests/Bakabase.Modules.HealthScore.Tests/Bakabase.Modules.HealthScore.Tests.csproj"
            "src/tests/Bakabase.Modules.Player.Tests/Bakabase.Modules.Player.Tests.csproj"
            "src/tests/Bakabase.Modules.Property.Tests/Bakabase.Modules.Property.Tests.csproj"
            "src/tests/Bakabase.Modules.StandardValue.Tests/Bakabase.Modules.StandardValue.Tests.csproj"
            "src/tests/Bakabase.Modules.ThirdParty.Tests/Bakabase.Modules.ThirdParty.Tests.csproj"
          )
          failed=()
          for proj in "${projects[@]}"; do
            echo "::group::dotnet test ${proj}"
            dotnet test "${proj}" || failed+=("${proj}")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::Test project failed: %s\n' "${failed[@]}"
            exit 1
          fi

  frontend:
    if: inputs.suite != 'packages'
    name: Frontend lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable yarn

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            src/web/.yarn/cache
            src/web/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('src/web/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        if: ${{ !cancelled() }}
        run: yarn vitest run

      - name: Production build
        if: ${{ !cancelled() }}
        run: yarn build

      - name: Frontend for integration and package checks
        uses: actions/upload-artifact@v4
        with:
          name: ci-web
          path: src/web/dist
          retention-days: 3

  # Real processes on Linux: three production-startup hosts talking the node
  # protocol, the headless publish contents, and the legacy-client migration
  # in a browser. The unit/integration tests already run in backend-tests.
  federation:
    if: inputs.suite != 'platforms' && inputs.suite != 'packages'
    name: Multi-device federation (Linux)
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/tests/federation-browser-smoke/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: ci-web
          path: src/web/dist
      - name: Release identities and their guard cases
        run: |
          python src/scripts/check-release-contract.py --report "$RUNNER_TEMP/federation-results/product-identities.json"
          python src/tests/upgrade-tests/test_release_contract.py
          python src/tests/upgrade-tests/test_package_acceptance.py
      - name: Three independent hosts
        run: |
          dotnet build src/tests/Bakabase.Federation.TestHost/Bakabase.Federation.TestHost.csproj
          python src/tests/federation-smoke/run.py --timeout 300 --results-directory "$RUNNER_TEMP/federation-results/smoke"
      - name: Headless publish contents
        run: |
          dotnet publish src/apps/Bakabase.Service/Bakabase.Service.csproj -p:RuntimeMode=DOCKER --self-contained false -r linux-x64 -o "$RUNNER_TEMP/publish-server"
          cp -R src/web/dist "$RUNNER_TEMP/publish-server/web"
          python src/scripts/check-release-contract.py --role server --publish-dir "$RUNNER_TEMP/publish-server" --require-web --report "$RUNNER_TEMP/federation-results/server-package.json"
      - name: Legacy client export, import, reauthorization and media in a browser
        run: |
          (cd src/tests/federation-browser-smoke && npm ci --ignore-scripts && npx playwright install --with-deps chromium)
          python3 -m unittest discover -s src/tests/federation-browser-smoke -p 'test*.py'
          python3 src/tests/federation-browser-smoke/run.py --results-directory "$RUNNER_TEMP/federation-results/browser"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-evidence
          path: ${{ runner.temp }}/federation-results
          if-no-files-found: warn
          retention-days: 14

  # On demand before a release: what only a real desktop OS can show.
  federation-platforms:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'platforms'
    name: Desktop platform contracts (${{ matrix.rid }})
    needs: frontend
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, rid: win-x64, runtimeMode: WINFORMS}
          - {os: macos-15-intel, rid: osx-x64, runtimeMode: MACOS}
          - {os: macos-15, rid: osx-arm64, runtimeMode: MACOS}
          - {os: ubuntu-24.04, rid: linux-x64, runtimeMode: DOCKER}
    defaults:
      run:
        shell: bash
    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ci-web
          path: src/web/dist
      - name: Identity, AppData, relocation and migration contracts
        run: python src/tests/upgrade-tests/run-compatibility.py --results-directory "$RUNNER_TEMP/federation-results/compatibility"
      - name: Federation protocol and Service integration
        run: |
          dotnet test src/tests/Bakabase.Modules.Federation.Tests/Bakabase.Modules.Federation.Tests.csproj
          dotnet test src/tests/Bakabase.Modules.Player.Tests/Bakabase.Modules.Player.Tests.csproj
          dotnet test src/tests/Bakabase.Tests/Bakabase.Tests.csproj --filter "FullyQualifiedName~Bakabase.Tests.Federation"
      - name: Verify the actual macOS rectangle calling convention
        if: startsWith(matrix.rid, 'osx-')
        run: |
          dotnet run --project src/tests/Bakabase.Shell.NativeAbiProbe \
            --configuration Release -p:RuntimeMode=MACOS \
            -- --report "$RUNNER_TEMP/federation-results/native-abi.json"
      - name: Three independent hosts
        run: |
          dotnet build src/tests/Bakabase.Federation.TestHost/Bakabase.Federation.TestHost.csproj
          python src/tests/federation-smoke/run.py --timeout 300 --results-directory "$RUNNER_TEMP/federation-results/smoke"
      - name: Desktop publish contents
        if: matrix.runtimeMode != 'DOCKER'
        run: |
          dotnet publish src/apps/Bakabase.App/Bakabase.App.csproj -p:RuntimeMode=${{ matrix.runtimeMode }} --self-contained false -r ${{ matrix.rid }} -o "$RUNNER_TEMP/publish-unified"
          cp -R src/web/dist "$RUNNER_TEMP/publish-unified/web"
          python src/scripts/check-release-contract.py --role unified --publish-dir "$RUNNER_TEMP/publish-unified" --require-web --report "$RUNNER_TEMP/federation-results/unified-package.json"
          dotnet publish src/apps/Bakabase.Client.App/Bakabase.Client.App.csproj -p:RuntimeMode=${{ matrix.runtimeMode }} --self-contained false -r ${{ matrix.rid }} -o "$RUNNER_TEMP/publish-client"
          python src/scripts/check-release-contract.py --role client --publish-dir "$RUNNER_TEMP/publish-client" --report "$RUNNER_TEMP/federation-results/client-package.json"
      - name: Decoded video, slow streams, seek, interruption and opt-out
        if: matrix.runtimeMode == 'DOCKER'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          # Owned fixture only: no user media and no video upload in the evidence artifact.
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=24" -t 120 -an \
            -c:v libvpx -deadline realtime -cpu-used 8 -b:v 900k -g 48 \
            "$RUNNER_TEMP/federation-stream-fixture.webm"
          python3 src/tests/federation-smoke/media-stream.py \
            --media "$RUNNER_TEMP/federation-stream-fixture.webm" \
            --results-directory "$RUNNER_TEMP/federation-results/media" \
            --timeout 240
      - name: Retain platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: federation-${{ matrix.rid }}-evidence
          path: ${{ runner.temp }}/federation-results
          if-no-files-found: warn
          retention-days: 14

  package-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'packages'
    uses: ./.github/workflows/_package_acceptance.yml
    with:
      ref: ${{ github.sha }}
