name: Extended native acceptance

on:
  workflow_call:
    inputs:
      area:
        required: true
        type: string
      package_run_id:
        required: false
        type: string
      native_gui_flow:
        required: false
        type: string
        default: empty-library
      native_gui_platform:
        required: false
        type: string
        default: all

permissions:
  contents: read
  actions: read

jobs:
  performance:
    if: inputs.area == 'performance' || inputs.area == 'all'
    name: Query performance (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, rid: win-x64}
          - {os: ubuntu-24.04, rid: linux-x64}
          - {os: macos-15-intel, rid: osx-x64}
          - {os: macos-15, rid: osx-arm64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - name: Validate measurement and cleanup guards
        run: python -m unittest discover -s src/tests/federation-smoke -p 'test_benchmark*.py' -v
      - name: Build production Service fixture
        run: dotnet build src/tests/Bakabase.Federation.TestHost/Bakabase.Federation.TestHost.csproj
      - name: Measure unchanged query budgets with two full libraries
        run: |
          python src/tests/federation-smoke/benchmark.py --dotnet dotnet \
            --counts 10000 100000 --repetitions 3 --timeout 900 \
            --results-directory "$RUNNER_TEMP/performance-results" \
            --concurrent-load 'GitHub-hosted VM; no intentionally added concurrent load'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-performance-${{ matrix.rid }}-evidence
          path: ${{ runner.temp }}/performance-results/
          if-no-files-found: warn
          retention-days: 14

  player:
    if: inputs.area == 'player' || inputs.area == 'all'
    name: Native video player (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, rid: win-x64}
          - {os: macos-15-intel, rid: osx-x64}
          - {os: macos-15, rid: osx-arm64}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - name: Validate native player fixture guards
        run: python src/tests/native-player-acceptance/test_acceptance.py
      - name: Fetch pinned first-party mpv CI build
        id: mpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python src/tests/native-player-acceptance/prepare.py --rid '${{ matrix.rid }}' \
            --output "$RUNNER_TEMP/player-inputs"
      - name: Build production Service fixture
        run: dotnet build src/tests/Bakabase.Federation.TestHost/Bakabase.Federation.TestHost.csproj
      - name: Verify actual production launch and video playback
        env:
          MPV_EXECUTABLE: ${{ steps.mpv.outputs.executable }}
          MPV_PROVENANCE: ${{ steps.mpv.outputs.provenance }}
        run: |
          python src/tests/native-player-acceptance/run.py --rid '${{ matrix.rid }}' \
            --mpv "$MPV_EXECUTABLE" --provenance "$MPV_PROVENANCE" \
            --results-directory "$RUNNER_TEMP/player-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-player-${{ matrix.rid }}-evidence
          path: |
            ${{ runner.temp }}/player-inputs/provenance.json
            ${{ runner.temp }}/player-results/
          if-no-files-found: warn
          retention-days: 14

  native-gui:
    if: inputs.area == 'native-gui' || inputs.area == 'all'
    name: Native GUI (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Only these fixed subsets are selectable. Empty/unknown reusable-workflow
        # input falls back to all three platforms, so a typo cannot omit coverage.
        include: ${{ fromJSON(inputs.native_gui_platform == 'windows' && '[{"os":"windows-latest","rid":"win-x64"}]' || inputs.native_gui_platform == 'macos' && '[{"os":"macos-15-intel","rid":"osx-x64"},{"os":"macos-15","rid":"osx-arm64"}]' || '[{"os":"windows-latest","rid":"win-x64"},{"os":"macos-15-intel","rid":"osx-x64"},{"os":"macos-15","rid":"osx-arm64"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native UI boundaries
        run: python -m unittest discover -s src/tests/native-gui-acceptance -p 'test_*.py' -v
      - uses: actions/setup-dotnet@v4
        if: inputs.native_gui_flow == 'federated'
        with:
          global-json-file: ./global.json
      - name: Build explicitly isolated production Shell and Service source fixture
        if: inputs.native_gui_flow == 'federated'
        run: |
          MODE=WINFORMS
          if [[ '${{ runner.os }}' == 'macOS' ]]; then MODE=MACOS; fi
          dotnet publish src/tests/Bakabase.NativeGui.SourceHost/Bakabase.NativeGui.SourceHost.csproj \
            --configuration Release --runtime '${{ matrix.rid }}' --self-contained true \
            -p:RuntimeMode="$MODE" --output "$RUNNER_TEMP/native-source-publish"
      - name: Verify candidate package provenance
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.package_run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python src/tests/upgrade-tests/prepare-installed-inputs.py \
            --repository "$SOURCE_REPOSITORY" --run-id "$SOURCE_RUN" --rid '${{ matrix.rid }}' \
            --output-directory "$RUNNER_TEMP/gui-inputs"
      - name: Probe the actual installed native windows
        env:
          UNIFIED_PACKAGES: ${{ steps.inputs.outputs.unified_directory }}
          CLIENT_PACKAGES: ${{ steps.inputs.outputs.client_directory }}
          PACKAGE_VERSION: ${{ steps.inputs.outputs.version }}
          PACKAGE_PROVENANCE: ${{ steps.inputs.outputs.provenance }}
          GUI_FLOW: ${{ inputs.native_gui_flow }}
        run: |
          OBSERVER_ARGS=()
          if [[ '${{ runner.os }}' == 'macOS' ]]; then OBSERVER_ARGS=(--macos-observer direct-ax); fi
          SOURCE_ARGS=()
          if [[ "$GUI_FLOW" == 'federated' ]]; then SOURCE_ARGS=(--source-publish "$RUNNER_TEMP/native-source-publish"); fi
          python src/tests/native-gui-acceptance/run-probe.py \
            --unified-packages "$UNIFIED_PACKAGES" --client-packages "$CLIENT_PACKAGES" \
            --rid '${{ matrix.rid }}' --version "$PACKAGE_VERSION" --provenance "$PACKAGE_PROVENANCE" \
            --results-directory "$RUNNER_TEMP/native-gui-results" --flow "$GUI_FLOW" "${OBSERVER_ARGS[@]}" "${SOURCE_ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-gui-${{ matrix.rid }}-evidence
          path: |
            ${{ runner.temp }}/gui-inputs/provenance.json
            ${{ runner.temp }}/native-gui-results/
          if-no-files-found: warn
          retention-days: 14

  historical:
    if: inputs.area == 'historical' || inputs.area == 'macos-data' || inputs.area == 'macos-data-arm' || inputs.area == 'all'
    name: ${{ startsWith(inputs.area, 'macos-data') && 'macOS beta data retention' || 'Published installer upgrade' }} (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Explicit ARM-only data mode avoids re-running the known original Intel
        # v349 startup failure. Intel byte-preservation has its own restore gate.
        # Neither this selection nor the data scope changes the historical gate.
        include: ${{ fromJSON(inputs.area == 'macos-data-arm' && '[{"os":"macos-15","rid":"osx-arm64"}]' || inputs.area == 'macos-data' && '[{"os":"macos-15-intel","rid":"osx-x64"},{"os":"macos-15","rid":"osx-arm64"}]' || '[{"os":"windows-latest","rid":"win-x64"},{"os":"macos-15-intel","rid":"osx-x64"},{"os":"macos-15","rid":"osx-arm64"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install bounded updater test tools
        run: |
          npm ci --ignore-scripts --prefix src/tests/installed-lifecycle-tools
          dotnet tool install --tool-path "$RUNNER_TEMP/historical-vpk-tools" vpk --version 1.2.0
      - name: Validate historical and installed failure guards
        run: |
          python -m unittest discover -s src/tests/upgrade-tests -p 'test_installed*.py'
          python src/tests/upgrade-tests/test_historical_upgrade.py
          python -m unittest discover -s src/tests/upgrade-tests -p 'test_macos_data*.py'
          python src/tests/upgrade-tests/check-installed-observer.py \
            --rid '${{ matrix.rid }}' --report "$RUNNER_TEMP/historical-observer.json"
      - name: Verify unchanged candidate packages
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.package_run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python src/tests/upgrade-tests/prepare-installed-inputs.py \
            --repository "$SOURCE_REPOSITORY" --run-id "$SOURCE_RUN" --rid '${{ matrix.rid }}' \
            --output-directory "$RUNNER_TEMP/historical-candidate-inputs"
      - name: Verify published original installers and prepare the candidate update
        env:
          GH_TOKEN: ${{ github.token }}
          UNIFIED_PACKAGES: ${{ steps.inputs.outputs.unified_directory }}
          CLIENT_PACKAGES: ${{ steps.inputs.outputs.client_directory }}
          PACKAGE_VERSION: ${{ steps.inputs.outputs.version }}
          PACKAGE_PROVENANCE: ${{ steps.inputs.outputs.provenance }}
        run: |
          python src/tests/upgrade-tests/historical-prepare.py \
            --unified-packages "$UNIFIED_PACKAGES" --client-packages "$CLIENT_PACKAGES" \
            --rid '${{ matrix.rid }}' --candidate-version "$PACKAGE_VERSION" --provenance "$PACKAGE_PROVENANCE" \
            --new-version '2.4.1-historical.${{ github.run_id }}.${{ github.run_attempt }}' \
            --vpk "$RUNNER_TEMP/historical-vpk-tools/vpk${{ runner.os == 'Windows' && '.exe' || '' }}" \
            --output-directory "$RUNNER_TEMP/historical-inputs"
      - name: Upgrade the actual published installations
        run: |
          AUTH_ARGS=()
          if [[ '${{ runner.os }}' == 'macOS' ]]; then AUTH_ARGS=(--macos-native-authorization); fi
          if [[ '${{ inputs.area }}' == 'macos-data' || '${{ inputs.area }}' == 'macos-data-arm' ]]; then AUTH_ARGS+=(--macos-data-retention); fi
          python src/tests/upgrade-tests/historical-installed.py \
            --manifest "$RUNNER_TEMP/historical-inputs/historical.json" --rid '${{ matrix.rid }}' \
            --results-directory "$RUNNER_TEMP/historical-results" "${AUTH_ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ startsWith(inputs.area, 'macos-data') && 'macos-data-retention' || 'historical-upgrade' }}-${{ matrix.rid }}-evidence
          path: |
            ${{ runner.temp }}/historical-observer.json
            ${{ runner.temp }}/historical-candidate-inputs/provenance.json
            ${{ runner.temp }}/historical-inputs/historical.json
            ${{ runner.temp }}/historical-inputs/release-metadata.json
            ${{ runner.temp }}/historical-inputs/vpk-version.log
            ${{ runner.temp }}/historical-inputs/candidate/*/vpk-pack.log
            ${{ runner.temp }}/historical-results/
          if-no-files-found: warn
          retention-days: 14
