name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      # Build the exact commit resolved by the caller, including PR validation.
      ref:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable yarn

      - name: Locate Yarn cache
        id: yarn-cache
        working-directory: src/web
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache.outputs.path }}
            src/web/node_modules
            src/web/.yarn/install-state.gz
          key: yarn-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('src/web/yarn.lock', 'src/web/package.json', 'src/web/.yarnrc.yml', 'src/web/.yarn/patches/**') }}
          restore-keys: |
            yarn-v2-${{ runner.os }}-${{ runner.arch }}-node22-

      - name: Install yarn dependencies
        working-directory: src/web
        run: yarn install --immutable

      - name: Build frontend
        working-directory: src/web
        run: yarn build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe-${{ github.run_attempt }}
          path: src/web/dist/*

  build-tampermonkey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: src/scripts/baka-monkey
        run: pnpm install --frozen-lockfile

      - name: Build tampermonkey script
        working-directory: src/scripts/baka-monkey
        run: pnpm build

      - name: Upload tampermonkey artifact
        uses: actions/upload-artifact@v4
        with:
          name: tampermonkey
          path: src/scripts/baka-monkey/dist/bakabase.user.js

  build-app:
    runs-on: ${{ matrix.os }}
    # Compile alongside the frontend; only packaging needs its artifact.

    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
      # Keep SDK/image packages and other RIDs out of this release cache.
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/release-packages

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: win-x64
            csproj: Bakabase/src/apps/Bakabase.App/Bakabase.App.csproj
            runtimeMode: WINFORMS
          - os: macos-15-intel
            rid: osx-x64
            artifact: osx-x64
            csproj: Bakabase/src/apps/Bakabase.App/Bakabase.App.csproj
            runtimeMode: MACOS
          - os: macos-15
            rid: osx-arm64
            artifact: osx-arm64
            csproj: Bakabase/src/apps/Bakabase.App/Bakabase.App.csproj
            runtimeMode: MACOS
          - os: ubuntu-latest
            rid: linux-x64
            artifact: docker
            csproj: Bakabase/src/apps/Bakabase.Service/Bakabase.Service.csproj
            runtimeMode: DOCKER
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: ${{ github.event.repository.name }}
          submodules: recursive
      - name: Copy global.json to workspace root
        run: cp ${{ github.event.repository.name }}/global.json .
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - name: Setup Python for release contract checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check dotnet info
        run: dotnet --info
      - name: Cache NuGet packages
        # Desktop cache extraction costs more than restoring packages directly.
        # Keep the smaller Linux cache, where the measured restore is cheaper.
        if: matrix.runtimeMode == 'DOCKER'
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          # Exact dependency keys avoid accumulating old package versions.
          key: release-nuget-v2-${{ runner.os }}-${{ matrix.rid }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '**/NuGet.Config', '**/nuget.config') }}
      - name: Build Bakabase project
        run: dotnet publish -p:RuntimeMode=${{ matrix.runtimeMode }} ${{matrix.csproj}} --self-contained -r ${{ matrix.rid }} -o ./publish
      - name: Wait for frontend artifact
        id: frontend-artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRONTEND_ARTIFACT: fe-${{ github.run_attempt }}
        shell: bash
        # A failed-job rerun may reuse the completed frontend from the same
        # run/commit; attempt-specific names keep artifact IDs immutable.
        run: python Bakabase/.github/scripts/wait_for_artifact.py --name "$FRONTEND_ARTIFACT" --allow-previous-attempts
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.frontend-artifact.outputs.artifact-id }}
          path: ./publish/web
          merge-multiple: true
      - name: Verify product and published role boundaries
        shell: bash
        run: |
          ROLE=unified
          if [[ "${{ matrix.runtimeMode }}" == "DOCKER" ]]; then ROLE=server; fi
          python Bakabase/src/scripts/check-release-contract.py --role "$ROLE" --publish-dir ./publish --require-web
      # vpk builds the Setup.exe / Update.exe binaries that the Velopack NuGet package talks
      # to, and Velopack ships both halves under one version number — they are meant to match.
      # Unpinned, this step silently took whatever was newest, so the installer version drifted
      # from the library on its own schedule and every build was a different pair. Pinned to the
      # version releases are already being cut with; raising it means raising the Velopack
      # PackageReference in lockstep.
      - name: Install Velopack CLI
        if: matrix.runtimeMode == 'WINFORMS' || matrix.runtimeMode == 'MACOS'
        run: dotnet tool install -g vpk --version 1.2.0
      - name: Determine Velopack channel
        if: matrix.runtimeMode == 'WINFORMS' || matrix.runtimeMode == 'MACOS'
        id: vpk-channel
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_LOWER="$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')"
          if [[ "$VERSION_LOWER" == *beta* || "$VERSION_LOWER" == *rc* ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "channel=" >> $GITHUB_OUTPUT
          fi
      - name: Pack Velopack release
        if: matrix.runtimeMode == 'WINFORMS' || matrix.runtimeMode == 'MACOS'
        shell: bash
        run: |
          CHANNEL_ARG=""
          if [[ -n "${{ steps.vpk-channel.outputs.channel }}" ]]; then
            CHANNEL_ARG="--channel ${{ steps.vpk-channel.outputs.channel }}"
          fi
          PLIST_ARG=""
          if [[ "${{ matrix.runtimeMode }}" == "WINFORMS" ]]; then
            MAIN_EXE="Bakabase.exe"
            ICON_ARG="--icon ./publish/Assets/favicon.ico"
          else
            MAIN_EXE="Bakabase"
            ICON_ARG="--icon ./publish/Assets/app.icns"
            python Bakabase/src/scripts/prepare-macos-plist.py --template ./publish/Info.plist --output ./publish/Info.plist --version "${{ inputs.version }}"
            PLIST_ARG="--plist ./publish/Info.plist"
          fi
          vpk pack \
            --packId Bakabase \
            --packVersion "${{ inputs.version }}" \
            --packDir ./publish \
            --mainExe "$MAIN_EXE" \
            --outputDir ./vpk-output \
            $ICON_ARG \
            $PLIST_ARG \
            $CHANNEL_ARG
          if [[ "${{ matrix.runtimeMode }}" == "MACOS" ]]; then
            python Bakabase/src/scripts/check-release-contract.py --role unified --publish-dir ./publish --require-web --macos-portable-dir ./vpk-output --version "${{ inputs.version }}"
          fi
      - name: Upload Velopack artifact
        if: matrix.runtimeMode == 'WINFORMS' || matrix.runtimeMode == 'MACOS'
        uses: actions/upload-artifact@v4
        with:
          name: vpk-${{ matrix.artifact }}
          path: ./vpk-output/*
          # Installers, nupkg and portable ZIPs are already compressed.
          compression-level: 0
      - name: Upload Bakabase build artifact
        # Desktop consumers use vpk-*; only Docker needs the raw publish tree.
        if: matrix.runtimeMode == 'DOCKER'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/*
      - name: Uploaded artifact debug
        run: |
          echo "Uploaded artifact name=${{ matrix.artifact }}"
          echo "Total files: $(find ./publish -type f | wc -l)"
