name: Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      # Commit SHA to build. Required because the caller runs under
      # `workflow_run`, where the default GITHUB_SHA points at the default
      # branch's HEAD instead of the commit CI validated.
      ref:
        required: true
        type: string

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Cache Yarn
        uses: actions/cache@v4
        with:
          path: |
            src/web/.yarn/cache
            src/web/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('src/web/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable yarn

      - name: Install yarn dependencies
        working-directory: src/web
        run: yarn install

      - name: Build frontend
        working-directory: src/web
        run: yarn build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: fe
          path: src/web/dist/*

  build-tampermonkey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: src/scripts/baka-monkey
        run: pnpm install --frozen-lockfile

      - name: Build tampermonkey script
        working-directory: src/scripts/baka-monkey
        run: pnpm build

      - name: Upload tampermonkey artifact
        uses: actions/upload-artifact@v4
        with:
          name: tampermonkey
          path: src/scripts/baka-monkey/dist/bakabase.user.js

  build-app:
    runs-on: ${{ matrix.os }}
    needs: [build-frontend]

    env:
      DOTNET_MULTILEVEL_LOOKUP: 0

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: win-x64
            csproj: Bakabase/src/apps/Bakabase.App/Bakabase.App.csproj
            nuget-path: ~\\.nuget\\packages
            runtimeMode: WINFORMS
          - os: macos-15-intel
            rid: osx-x64
            artifact: osx-x64
            csproj: Bakabase/src/apps/Bakabase.App/Bakabase.App.csproj
            nuget-path: ~/.nuget/packages
            runtimeMode: MACOS
          - os: macos-15
            rid: osx-arm64
            artifact: osx-arm64
            csproj: Bakabase/src/apps/Bakabase.App/Bakabase.App.csproj
            nuget-path: ~/.nuget/packages
            runtimeMode: MACOS
          - os: ubuntu-latest
            rid: linux-x64
            artifact: docker
            csproj: Bakabase/src/apps/Bakabase.Service/Bakabase.Service.csproj
            nuget-path: ~/.nuget/packages
            runtimeMode: DOCKER
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: ${{ github.event.repository.name }}
          submodules: recursive
      - name: Copy global.json to workspace root
        run: cp ${{ github.event.repository.name }}/global.json .
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - name: Setup Python for release contract checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check dotnet info
        run: dotnet --info
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ matrix.nuget-path }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build Bakabase project
        run: dotnet publish -p:RuntimeMode=${{ matrix.runtimeMode }} ${{matrix.csproj}} --self-contained -r ${{ matrix.rid }} -o ./publish
      # The thin client's half must not travel with the server's. Nothing references it
      # today, and this is what says so out loud: a stray project reference would
      # otherwise ship the forwarding layer, the device keys' storage and the connect
      # page inside the container image, where none of them mean anything.
      - name: Assert the server carries none of the client
        shell: bash
        run: |
          if ls ./publish/Bakabase.Client*.dll >/dev/null 2>&1; then
            echo "The client's assemblies were published with the server:"
            ls -1 ./publish/Bakabase.Client*.dll
            exit 1
          fi
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: fe
          path: ./publish/web
      - name: Verify product and published role boundaries
        shell: bash
        run: |
          ROLE=unified
          if [[ "${{ matrix.runtimeMode }}" == "DOCKER" ]]; then ROLE=server; fi
          python Bakabase/src/tests/upgrade-tests/check-release-contract.py --role "$ROLE" --publish-dir ./publish --require-web
      # vpk builds the Setup.exe / Update.exe binaries that the Velopack NuGet package talks
      # to, and Velopack ships both halves under one version number — they are meant to match.
      # Unpinned, this step silently took whatever was newest, so the installer version drifted
      # from the library on its own schedule and every build was a different pair. Pinned to the
      # version releases are already being cut with; raising it means raising the Velopack
      # PackageReference in lockstep.
      - name: Install Velopack CLI
        if: matrix.runtimeMode == 'WINFORMS' || matrix.runtimeMode == 'MACOS'
        run: dotnet tool install -g vpk --version 1.2.0
      - name: Determine Velopack channel
        if: matrix.runtimeMode == 'WINFORMS' || matrix.runtimeMode == 'MACOS'
        id: vpk-channel
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION_LOWER="$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')"
          if [[ "$VERSION_LOWER" == *beta* || "$VERSION_LOWER" == *rc* ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "channel=" >> $GITHUB_OUTPUT
          fi
      - name: Pack Velopack release
        if: matrix.runtimeMode == 'WINFORMS' || matrix.runtimeMode == 'MACOS'
        shell: bash
        run: |
          CHANNEL_ARG=""
          if [[ -n "${{ steps.vpk-channel.outputs.channel }}" ]]; then
            CHANNEL_ARG="--channel ${{ steps.vpk-channel.outputs.channel }}"
          fi
          PLIST_ARG=""
          if [[ "${{ matrix.runtimeMode }}" == "WINFORMS" ]]; then
            MAIN_EXE="Bakabase.exe"
            ICON_ARG="--icon ./publish/Assets/favicon.ico"
          else
            MAIN_EXE="Bakabase"
            ICON_ARG="--icon ./publish/Assets/app.icns"
            python Bakabase/src/scripts/prepare-macos-plist.py --template ./publish/Info.plist --output ./publish/Info.plist --version "${{ inputs.version }}"
            PLIST_ARG="--plist ./publish/Info.plist"
          fi
          vpk pack \
            --packId Bakabase \
            --packVersion "${{ inputs.version }}" \
            --packDir ./publish \
            --mainExe "$MAIN_EXE" \
            --outputDir ./vpk-output \
            $ICON_ARG \
            $PLIST_ARG \
            $CHANNEL_ARG
          if [[ "${{ matrix.runtimeMode }}" == "MACOS" ]]; then
            python Bakabase/src/tests/upgrade-tests/check-release-contract.py --role unified --publish-dir ./publish --require-web --macos-portable-dir ./vpk-output --version "${{ inputs.version }}"
          fi
      - name: Upload Velopack artifact
        if: matrix.runtimeMode == 'WINFORMS' || matrix.runtimeMode == 'MACOS'
        uses: actions/upload-artifact@v4
        with:
          name: vpk-${{ matrix.artifact }}
          path: ./vpk-output/*
      - name: Upload Bakabase build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/*
      - name: Uploaded artifact debug
        run: |
          echo "Uploaded artifact name=${{ matrix.artifact }}"
          echo "Total files: $(find ./publish -type f | wc -l)"

  # The thin client. A job of its own rather than three more rows in build-app's
  # matrix, because every row there would have needed a new key and two steps would
  # have needed conditions — and the one thing this change must not do is alter what
  # the all-in-one publishes.
  #
  # There is no -p:AppFlavor=: the flavour is decided by which entry project gets
  # published. Bakabase.App.csproj puts the server behind the shell, Bakabase.Client.App
  # puts the forwarding layer there, and nothing else differs.
  build-client:
    runs-on: ${{ matrix.os }}

    env:
      DOTNET_MULTILEVEL_LOOKUP: 0

    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: win-x64
            nuget-path: ~\\.nuget\\packages
            runtimeMode: WINFORMS
          - os: macos-15-intel
            rid: osx-x64
            artifact: osx-x64
            nuget-path: ~/.nuget/packages
            runtimeMode: MACOS
          - os: macos-15
            rid: osx-arm64
            artifact: osx-arm64
            nuget-path: ~/.nuget/packages
            runtimeMode: MACOS
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: ${{ github.event.repository.name }}
          submodules: recursive
      - name: Copy global.json to workspace root
        run: cp ${{ github.event.repository.name }}/global.json .
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - name: Setup Python for release contract checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ matrix.nuget-path }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build Bakabase client
        run: dotnet publish -p:RuntimeMode=${{ matrix.runtimeMode }} Bakabase/src/apps/Bakabase.Client.App/Bakabase.Client.App.csproj --self-contained -r ${{ matrix.rid }} -o ./publish

      # No frontend download here, on purpose (R12 in the execution plan). The client
      # gets the frontend from whichever server it connects to, so shipping a copy
      # would add weight and raise the question of which one wins. The one page it
      # serves itself — the connect screen — is embedded in Bakabase.Client.Remoting.
      - name: Verify no frontend was packed
        shell: bash
        run: |
          if [ -d ./publish/web ]; then
            echo "::error::The client publish contains a web/ directory. The client must not ship the frontend."
            exit 1
          fi
          test -f ./publish/Bakabase.Client.Remoting.dll
      - name: Verify legacy client product and dependency boundaries
        shell: bash
        run: python Bakabase/src/tests/upgrade-tests/check-release-contract.py --role client --publish-dir ./publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0
      - name: Determine Velopack channel
        id: vpk-channel
        shell: bash
        run: |
          VERSION_LOWER="$(echo "${{ inputs.version }}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$VERSION_LOWER" == *beta* || "$VERSION_LOWER" == *rc* ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "channel=" >> $GITHUB_OUTPUT
          fi
      - name: Pack Velopack release
        shell: bash
        run: |
          CHANNEL_ARG=""
          if [[ -n "${{ steps.vpk-channel.outputs.channel }}" ]]; then
            CHANNEL_ARG="--channel ${{ steps.vpk-channel.outputs.channel }}"
          fi
          PLIST_ARG=""
          if [[ "${{ matrix.runtimeMode }}" == "WINFORMS" ]]; then
            MAIN_EXE="Bakabase.Client.exe"
            ICON_ARG="--icon ./publish/Assets/favicon.ico"
          else
            MAIN_EXE="Bakabase.Client"
            ICON_ARG="--icon ./publish/Assets/app.icns"
            python Bakabase/src/scripts/prepare-macos-plist.py --template ./publish/Info.plist --output ./publish/Info.plist --version "${{ inputs.version }}"
            PLIST_ARG="--plist ./publish/Info.plist"
          fi
          # A pack id of its own, and it is load-bearing: Velopack keys a release
          # channel by it, and an update manifest written under the all-in-one's id
          # would hand every existing installation the client as its next version.
          vpk pack \
            --packId Bakabase.Client \
            --packTitle "Bakabase Client" \
            --packVersion "${{ inputs.version }}" \
            --packDir ./publish \
            --mainExe "$MAIN_EXE" \
            --outputDir ./vpk-output \
            $ICON_ARG \
            $PLIST_ARG \
            $CHANNEL_ARG
          if [[ "${{ matrix.runtimeMode }}" == "MACOS" ]]; then
            python Bakabase/src/tests/upgrade-tests/check-release-contract.py --role client --publish-dir ./publish --macos-portable-dir ./vpk-output --version "${{ inputs.version }}"
          fi

      # Named so it does NOT match the `vpk-*` pattern the release workflow globs for
      # the all-in-one. Two products in one release, collected separately.
      - name: Upload Velopack artifact
        uses: actions/upload-artifact@v4
        with:
          name: velopack-client-${{ matrix.artifact }}
          path: ./vpk-output/*
      - name: Upload client build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.artifact }}
          path: ./publish/*
