# Gates PRs that touch the mobile app. Deliberately NOT a required status
# check: it only triggers on mobile paths, and a path-filtered required check
# would leave every non-mobile PR pending forever. The desktop pipeline
# (ci.yml) keeps running on all PRs untouched.
name: Mobile CI

on:
  pull_request:
    paths:
      - "src/apps/mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze, test & debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/mobile/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the version the app is developed against.
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        if: ${{ !cancelled() }}
        run: flutter test

      - name: Build debug APK
        if: ${{ !cancelled() }}
        run: flutter build apk --debug
