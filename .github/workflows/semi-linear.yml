# Semi-linear history: a PR may be merged (merge commit or rebase) only if its
# branch is rebased onto the latest base branch and contains no merge commits.
# Required by the "semi-linear" repository ruleset, together with
# "Require branches to be up to date before merging".
name: semi-linear

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  semi-linear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch is rebased onto base
        env:
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          git -c "http.extraheader=$auth" fetch -q --no-tags --filter=tree:0 \
            "https://github.com/$REPO" "+refs/heads/$BASE_REF:refs/base" "$HEAD_SHA"
          base=$(git rev-parse refs/base)

          if ! git merge-base --is-ancestor "$base" "$HEAD_SHA"; then
            echo "::error::Branch is not rebased onto the latest '$BASE_REF' (${base:0:7}). Run: git fetch origin && git rebase origin/$BASE_REF && git push --force-with-lease"
            exit 1
          fi

          merges=$(git rev-list --merges "$base..$HEAD_SHA")
          if [ -n "$merges" ]; then
            echo "::error::Branch contains merge commits; rebase onto '$BASE_REF' instead of merging it in:"
            git log --oneline --no-walk $merges
            exit 1
          fi

          echo "OK: ${HEAD_SHA:0:7} is rebased onto $BASE_REF@${base:0:7} with $(git rev-list --count "$base..$HEAD_SHA") linear commit(s)."
