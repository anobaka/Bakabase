# Releases the mobile app: split-per-abi APKs for Android, an unsigned IPA for
# SideStore (which signs on-device with the user's own Apple ID), a GitHub
# Release under the mobile-v* tag, and a regenerated SideStore source on the
# `sidestore` branch. Completely separate from the desktop deploy pipeline —
# mobile versions live in the app's pubspec + tags, not version.json.
name: Mobile Release

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0); must match an intent to tag mobile-v{version}"
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.2"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#mobile-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.].+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          lower="$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')"
          if [[ "$lower" == *beta* || "$lower" == *rc* || "$lower" == *alpha* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/mobile/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT=build/app/outputs/flutter-apk
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="$OUT/app-$abi-release.apk"
            [ -f "$src" ] && cp "$src" "dist/bakabase-mobile-$VERSION-android-$abi.apk"
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: src/apps/mobile/app/dist/*.apk

  ios:
    needs: prepare
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/apps/mobile/app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build unsigned iOS app
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Package unsigned IPA
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p dist Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/bakabase-mobile-$VERSION-ios-unsigned.ipa" Payload
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: src/apps/mobile/app/dist/*.ipa

  release:
    needs: [prepare, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Compose release notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cat > NOTES.md <<EOF
          ## Bakabase Mobile $VERSION

          Requires a running Bakabase server with remote access enabled.
          需要一台已开启远程访问的 Bakabase 主服务。

          ### Android
          Download the APK matching your device (arm64-v8a for most phones).
          下载与设备匹配的 APK（大多数手机为 arm64-v8a）。

          ### iOS (SideStore)
          Add this source in SideStore, then install Bakabase Mobile from it —
          the IPA is unsigned and gets signed on your device with your own
          Apple ID:
          在 SideStore 中添加以下源后安装（IPA 未签名，由 SideStore 在你的设备上用你自己的 Apple ID 签名）：

              https://raw.githubusercontent.com/${{ github.repository }}/sidestore/source.json

          Free Apple IDs are limited to 3 sideloaded apps and 7-day resigning
          (SideStore refreshes automatically on the same Wi-Fi).
          免费 Apple ID 有 3 个应用与 7 天重签限制（SideStore 可在同一 Wi-Fi 下自动续签）。
          EOF

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ needs.prepare.outputs.version }}
          name: Bakabase Mobile ${{ needs.prepare.outputs.version }}
          body_path: NOTES.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sidestore-source:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate source.json from all mobile releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/mobile/build_sidestore_source.py \
            --owner "${GITHUB_REPOSITORY%/*}" --repo "${GITHUB_REPOSITORY#*/}" \
            --out /tmp/source.json

      - name: Publish to the sidestore branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/sidestore && cd /tmp/sidestore
          cp /tmp/source.json .
          git init -b sidestore
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "chore: SideStore source for mobile-v${{ needs.prepare.outputs.version }}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            sidestore
