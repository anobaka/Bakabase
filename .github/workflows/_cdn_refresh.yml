name: Refresh CDN

on:
  # Called by the normal desktop deployment after all release artifacts have
  # reached OSS and GitHub.
  workflow_call:
    inputs:
      version:
        description: Version the refreshed manifests must expose
        required: true
        type: string
    secrets:
      CDN_ACCESS_KEY_ID:
        required: true
      CDN_ACCESS_KEY_SECRET:
        required: true

  # Recovery entry point for a stale edge. This refreshes and verifies the CDN
  # without rebuilding or publishing another application release.
  workflow_dispatch:
    inputs:
      version:
        description: Expected release version (for example, 2.4.0-beta.141)
        required: true
        type: string

permissions:
  contents: read

jobs:
  refresh-cdn:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate expected version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi

      - name: Checkout CDN refresh helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Install Alibaba Cloud CLI
        run: |
          curl -sL -o aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar xzf aliyun-cli.tgz
          chmod +x aliyun

      - name: Configure Alibaba Cloud CLI
        env:
          CDN_ACCESS_KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
          CDN_ACCESS_KEY_SECRET: ${{ secrets.CDN_ACCESS_KEY_SECRET }}
        run: |
          ./aliyun configure set \
            --profile default \
            --mode AK \
            --access-key-id "$CDN_ACCESS_KEY_ID" \
            --access-key-secret "$CDN_ACCESS_KEY_SECRET" \
            --region cn-hangzhou

      - name: Refresh affected CDN objects and verify every task
        # Never expire all releases/: historical update packages and changelogs
        # are immutable across versions and would otherwise fetch from OSS again.
        # Alibaba documents 5–6 minutes for refresh propagation; allow 6 minutes.
        run: python3 .github/scripts/refresh_cdn.py --version "$VERSION"

      - name: Verify CDN serves expected version
        shell: bash
        run: |
          VERSION_LOWER=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          # Must mirror the channel logic in _build.yml: beta/rc pack with
          # `--channel beta`; stable builds use Velopack's per-OS default.
          if [[ "$VERSION_LOWER" == *beta* || "$VERSION_LOWER" == *rc* ]]; then
            CHANNEL=beta
          else
            CHANNEL=
          fi

          PLATFORMS=(win-x64 osx-x64 osx-arm64)
          FAILED=()
          for plat in "${PLATFORMS[@]}"; do
            if [ -n "$CHANNEL" ]; then
              MANIFEST="releases.${CHANNEL}.json"
            else
              case "$plat" in
                win-*) MANIFEST=releases.win.json ;;
                osx-*) MANIFEST=releases.osx.json ;;
                *) echo "::error::No default Velopack channel known for platform $plat"; exit 1 ;;
              esac
            fi
            echo "[$plat] verifying manifest: $MANIFEST, expected version: $VERSION"
            URL="https://cdn-public.anobaka.com/app/bakabase/releases/${plat}/${MANIFEST}"
            OK=0
            for i in $(seq 1 6); do
              ACTUAL=$(curl -fsSL "$URL" | jq -r '.Assets[0].Version // empty' 2>/dev/null || echo "")
              echo "[$plat] attempt $i: got version='$ACTUAL', expected='$VERSION'"
              if [ "$ACTUAL" = "$VERSION" ]; then
                OK=1
                break
              fi
              sleep 5
            done
            if [ "$OK" -ne 1 ]; then
              FAILED+=("$plat")
            fi
          done

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "::error::CDN still serves a stale manifest after 30s for: ${FAILED[*]}"
            exit 1
          fi
          echo "CDN serves version $VERSION on all platforms"
