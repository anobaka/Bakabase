name: Build and Deploy

on:
  # Auto-deploy every push to main and to the release branches: a main push
  # publishes a beta, a release/v* push publishes the corresponding stable.
  # Nothing here inspects the branch to decide a version — version.json owns
  # that and the whole pipeline reads it through nbgv (main is currently
  # "2.4.0-beta.{height}", so each commit gets its own beta number).
  #
  # CI does not gate this: ci.yml runs on pull_request only and is a required
  # status check via branch protection, so whatever lands on main was already
  # validated on its PR. (Deploy used to chain off CI via `workflow_run`; that
  # cannot work now that CI deliberately skips merge commits.)
  #
  # debug-actions is intentionally left out — deploy it via workflow_dispatch.
  push:
    branches: [ main, 'release/v*' ]
  # Manual trigger: deploy any ref on demand — debug-actions, or a re-deploy
  # without a new commit. Pick the branch when dispatching.
  workflow_dispatch:

# Don't cancel an in-progress deploy — OSS uploads + GitHub releases shouldn't
# be torn down mid-flight. Serialize per target branch instead.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-var.outputs.version }}
      is_tag: ${{ steps.set-var.outputs.is_tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Resolve target commit
        id: target
        # Both push and workflow_dispatch run in the context of the target
        # commit itself, so github.ref / github.sha already point at it.
        run: |
          echo "ref=${{ github.ref }}" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Setup .NET for NBGV
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json

      - name: Get NBGV version info
        id: nbvg
        uses: dotnet/nbgv@v0.4.2
        with:
          setAllVars: true

      - name: Set version and tag info
        id: set-var
        run: |
          REF="${{ steps.target.outputs.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            TAG_NAME="${REF#refs/tags/}"
            # strip leading 'v' or 'V' from tag when setting version
            TAG_NO_V="${TAG_NAME#v}"
            TAG_NO_V="${TAG_NO_V#V}"
            echo "version=${TAG_NO_V}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            # Clean up version: remove trailing .0 for first beta (e.g., 2.2.0-beta.0 -> 2.2.0-beta)
            VERSION="${{ env.NBGV_CloudBuildNumber }}"
            if [[ "$VERSION" =~ ^(.+-[a-zA-Z]+)\.0$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
            fi
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
      - name: Debug prepare context
        run: |
          echo "github.event_name=${{ github.event_name }}"
          echo "github.ref=${{ github.ref }}"
          echo "github.sha=${{ github.sha }}"
          echo "resolved.ref=${{ steps.target.outputs.ref }}"
          echo "resolved.sha=${{ steps.target.outputs.sha }}"
          echo "resolved.version=${{ steps.set-var.outputs.version }}"
          echo "resolved.is_tag=${{ steps.set-var.outputs.is_tag }}"

  build:
    needs: [prepare]
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  # Attach mobile packages to the desktop release only when the app actually
  # changed since the previous release tag — an unchanged app keeps its
  # packages on the release that last built them.
  mobile-changes:
    needs: [prepare]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Diff mobile paths against the previous release tag
        id: diff
        run: |
          VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' src/apps/mobile/app/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Desktop releases are tagged v*; the tag for THIS run does not
          # exist yet, so describe resolves to the previous release.
          PREV=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            echo "No previous v* tag; building mobile packages"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$PREV"..HEAD -- \
              src/apps/mobile \
              scripts/mobile \
              .github/workflows/_mobile_build.yml; then
            echo "No mobile changes since $PREV; skipping mobile packages"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Mobile changed since $PREV; building mobile packages"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  mobile:
    needs: [prepare, mobile-changes]
    if: needs.mobile-changes.outputs.changed == 'true'
    uses: ./.github/workflows/_mobile_build.yml
    with:
      version: ${{ needs.mobile-changes.outputs.version }}
      build_number: ${{ github.run_number }}
      ref: ${{ needs.prepare.outputs.sha }}

  deploy:
    needs: [prepare, build]
    uses: ./.github/workflows/_deploy.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  release:
    needs: [prepare, build, mobile]
    # The mobile job is legitimately skipped when the app did not change;
    # only a real mobile build failure should block the release.
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.mobile.result == 'success' || needs.mobile.result == 'skipped') }}
    uses: ./.github/workflows/_release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      is_tag: ${{ needs.prepare.outputs.is_tag }}
      ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

  # When this run built mobile packages, mirror them to OSS and refresh the
  # SideStore source + download manifest — after the release exists, since
  # both generators scan the releases API.
  mobile-distribute:
    needs: [mobile, release]
    if: ${{ !cancelled() && needs.mobile.result == 'success' && needs.release.result == 'success' }}
    uses: ./.github/workflows/_mobile_distribute.yml
    secrets: inherit

  cdn-refresh:
    needs: [prepare, deploy, release]
    # `release` deliberately tolerates a skipped mobile build. GitHub propagates
    # that skipped ancestor unless this downstream job has its own status
    # condition, which previously skipped both the purge and its verification.
    if: ${{ !failure() && !cancelled() && needs.prepare.result == 'success' && needs.deploy.result == 'success' && needs.release.result == 'success' }}
    uses: ./.github/workflows/_cdn_refresh.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit
