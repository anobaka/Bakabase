name: Deploy

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      # See _build.yml — same workflow_run / GITHUB_SHA caveat.
      ref:
        required: true
        type: string

jobs:
  deploy-velopack:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - artifact: win-x64
          - artifact: osx-x64
          - artifact: osx-arm64
    env:
      PLATFORM: ${{ matrix.artifact }}
      RELEASES_BASE: oss://anobaka-public/app/bakabase/releases/${{ matrix.artifact }}
      ARCHIVE_BASE: oss://anobaka-public/app/bakabase/archives/${{ inputs.version }}/${{ matrix.artifact }}
      NAME_BASE: Bakabase-${{ inputs.version }}-${{ matrix.artifact }}
    steps:
      - name: Install ossutil
        run: |
          wget -O ossutil64 https://gosspublic.alicdn.com/ossutil/1.7.16/ossutil64
          chmod +x ossutil64

      - name: Configure ossutil
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # Regional uploads avoid the per-GB cross-border acceleration fee.
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: |
          ./ossutil64 config -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"

      - name: Download Velopack artifact
        uses: actions/download-artifact@v4
        with:
          name: vpk-${{ matrix.artifact }}
          path: ./vpk-output

      - name: Upload Velopack update files to OSS
        run: |
          # Installers and the Windows portable are uploaded once by the next
          # step, then copied into this feed from their versioned archive.
          EXCLUDES=()
          if [[ "$PLATFORM" == win-* ]]; then
            EXCLUDES+=(--exclude '*Setup*.exe' --exclude '*-Portable.zip')
          else
            EXCLUDES+=(--exclude '*.pkg')
          fi
          ./ossutil64 cp -rf ./vpk-output/ "$RELEASES_BASE/" "${EXCLUDES[@]}"

      # Archived under the same name the GitHub Release asset carries, so a given
      # download has exactly one name wherever a user meets it — release page, CDN
      # link, or the file in their downloads folder. The vpk-produced name
      # (Bakabase-beta-Setup.exe) says nothing about version or platform and differs
      # per channel, which is what made the CDN and GitHub halves drift apart.
      #
      # The updater's releases/ feed keeps the original vpk-produced names;
      # archives/ carries the versioned names linked from the release notes.
      - name: Archive installers and mirror them to the release feed
        run: |
          # Archive first: another branch can publish to the same mutable feed
          # concurrently, but this version's archive must contain our build.
          publish_installer() {
            local source="$1" archive_name="$2" archive_url
            archive_url="${ARCHIVE_BASE}/${archive_name}"
            ./ossutil64 cp -f "$source" "$archive_url"
            if ! ./ossutil64 cp -f "$archive_url" "$RELEASES_BASE/$(basename "$source")"; then
              # Existing write-only RAM grants may not allow server-side copy.
              # The regional upload fallback still avoids acceleration fees.
              echo "::warning::OSS server-side copy failed; uploading $(basename "$source") to the release feed"
              ./ossutil64 cp -f "$source" "$RELEASES_BASE/$(basename "$source")"
            fi
          }

          for f in ./vpk-output/*Setup*.exe; do
            [ -f "$f" ] || continue
            publish_installer "$f" "${NAME_BASE}-Setup.exe"
          done
          for f in ./vpk-output/*.pkg; do
            [ -f "$f" ] || continue
            publish_installer "$f" "${NAME_BASE}-Setup.pkg"
          done
          if [[ "$PLATFORM" == win-* ]]; then
            for f in ./vpk-output/*-Portable.zip; do
              [ -f "$f" ] || continue
              publish_installer "$f" "${NAME_BASE}-Portable.zip"
            done
          fi

  deploy-tampermonkey:
    runs-on: ubuntu-latest
    steps:
      - name: Download tampermonkey artifact
        uses: actions/download-artifact@v4
        with:
          name: tampermonkey
          path: .

      - name: Install ossutil
        run: |
          wget -O ossutil64 https://gosspublic.alicdn.com/ossutil/1.7.16/ossutil64
          chmod +x ossutil64

      - name: Upload tampermonkey script to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: |
          ./ossutil64 config -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"
          ./ossutil64 cp -f bakabase.user.js oss://anobaka-public/app/bakabase/scripts/bakabase.user.js

  deploy-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Download Bakabase build artifact
        uses: actions/download-artifact@v4
        with:
          pattern: docker-*
          path: ./publish

      - name: Set up QEMU for target-platform packages
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Each publish tree was built and started on its native runner. QEMU is
      # used only when installing ARM64 distribution packages on this runner.
      - name: Publish multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./publish
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bakabase:${{ inputs.version }}
