name: bakabase_mobile
description: "Thin companion app for a Bakabase server on the local network."
publish_to: "none"

# App version is independent of the desktop version.json; compatibility with the
# server is negotiated via the remote-access protocol version, not version
# numbers. Release tags use mobile-v{version}.
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # Pinned to 2.x on purpose; 3.x changes provider APIs.
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  # mDNS/Bonjour through the platform NSD APIs — the only discovery route a
  # SideStore-signed iOS build may use (raw multicast needs an entitlement
  # sideloaded apps cannot hold).
  bonsoir: ^5.1.11
  shared_preferences: ^2.3.0
  cached_network_image: ^3.4.1
  # In-app playback: libmpv decodes MKV/HEVC/DTS on-device, which is the whole
  # point of streaming /file/raw instead of transcoding on the host.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  # External-player handoff (ported from the web's playerSchemes.ts).
  url_launcher: ^6.3.0
  android_intent_plus: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true
